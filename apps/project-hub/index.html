<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Hub - Alan-Toolkit</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>📦 Project Hub</h1>
      <button id="themeToggle" aria-label="切换主题">🌙</button>
    </div>
  </header>

  <main>
    <section id="stats-bar" class="card-section">
      <div id="stats-grid">
        <div class="stat-card"><span class="stat-value" id="stat-total">0</span><span class="stat-label">全部</span></div>
        <div class="stat-card"><span class="stat-value" id="stat-active">0</span><span class="stat-label">进行中</span></div>
        <div class="stat-card"><span class="stat-value" id="stat-planning">0</span><span class="stat-label">规划中</span></div>
        <div class="stat-card"><span class="stat-value" id="stat-completed">0</span><span class="stat-label">已完成</span></div>
        <div class="stat-card"><span class="stat-value" id="stat-archived">0</span><span class="stat-label">已归档</span></div>
      </div>
    </section>

    <section id="toolbar-section" class="card-section">
      <div id="toolbar">
        <input id="search-input" type="text" placeholder="搜索项目名称…">
        <select id="status-filter">
          <option value="all">全部状态</option>
          <option value="active">进行中</option>
          <option value="planning">规划中</option>
          <option value="paused">暂停</option>
          <option value="completed">已完成</option>
          <option value="archived">已归档</option>
        </select>
        <select id="sort-select">
          <option value="updated-desc">最近更新</option>
          <option value="updated-asc">最早更新</option>
          <option value="name-asc">名称 A→Z</option>
          <option value="name-desc">名称 Z→A</option>
          <option value="priority-desc">优先级 ↓</option>
          <option value="priority-asc">优先级 ↑</option>
        </select>
        <button id="add-btn">＋ 新建项目</button>
        <button id="export-btn" class="toolbar-btn" title="导出 JSON">📤</button>
        <button id="import-btn" class="toolbar-btn" title="导入 JSON">📥</button>
        <input type="file" id="import-input" accept=".json" hidden>
      </div>
    </section>

    <section id="projects-section" class="card-section">
      <div id="projects-grid"></div>
      <div id="projects-empty" class="empty-state">暂无项目，点击「新建项目」开始</div>
    </section>
  </main>

  <!-- ── 编辑弹窗 ── -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">新建项目</h3>
        <button id="modal-close" class="modal-close-btn">✕</button>
      </div>
      <div class="modal-body">
        <label>项目名称 <input id="edit-name" type="text" placeholder="输入项目名称"></label>
        <label>状态
          <select id="edit-status">
            <option value="planning">规划中</option>
            <option value="active" selected>进行中</option>
            <option value="paused">暂停</option>
            <option value="completed">已完成</option>
            <option value="archived">已归档</option>
          </select>
        </label>
        <label>优先级
          <select id="edit-priority">
            <option value="low">低</option>
            <option value="medium" selected>中</option>
            <option value="high">高</option>
          </select>
        </label>
        <label>标签（逗号分隔）<input id="edit-tags" type="text" placeholder="例如: frontend, api"></label>
        <label>仓库地址 <input id="edit-repo" type="text" placeholder="https://github.com/..."></label>
        <label>描述 <textarea id="edit-desc" rows="3" placeholder="项目描述"></textarea></label>
        <label>备注 <textarea id="edit-notes" rows="2" placeholder="其他备注"></textarea></label>
      </div>
      <div class="modal-footer">
        <button id="modal-delete" class="btn-danger" style="display:none">删除项目</button>
        <div>
          <button id="modal-cancel" class="btn-secondary">取消</button>
          <button id="modal-save" class="btn-primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
