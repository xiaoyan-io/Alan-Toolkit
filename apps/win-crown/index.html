<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WIN CROWN REV15.1</title><style>*{box-sizing:border-box}body{font:15px system-ui;margin:0;background:#edf3f1;color:#173d35}header{background:#173b35;color:white;padding:18px}h1{font-size:21px;margin:0}main{max-width:950px;margin:auto;padding:12px}.card{background:white;padding:14px;border-radius:14px;margin:10px 0}canvas{width:100%;height:380px;display:block;touch-action:none;background:#e5eeeb;border-radius:10px}button,input{font:inherit;border:1px solid #bbcfc8;border-radius:8px;padding:9px;min-height:42px}button{background:#e7f0ec;margin:3px}input{width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #dde6e2;text-align:left}small{color:#61756e}.row{display:flex;flex-wrap:wrap;gap:5px}.note{background:#fff5e2;padding:10px;border-radius:8px;font-size:12px}@media(min-width:750px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style><header><h1>WIN CROWN｜REV15.1 工程工作台</h1><small style="color:#c4dcd3">14柱 · 7榀桁架 · FOR DISCUSSION ONLY</small></header><main><section class="card"><h2>交互式3D模型</h2><div class="row" id="views"><button data-v="iso">透视</button><button data-v="front">正视</button><button data-v="side">侧视</button><button data-v="top">俯视</button><button id="reset">重置</button></div><div class="row"><label><input type="checkbox" id="columns" checked>钢柱</label><label><input type="checkbox" id="trusses" checked>桁架</label><label><input type="checkbox" id="braces" checked>X支撑</label></div><canvas id="c"></canvas><small>单指旋转，双指缩放；几何概念线框</small></section><section class="card"><h2>参数编辑</h2><div class="grid" id="fields"></div></section><section class="card"><h2>N01—N06 节点</h2><div class="row" id="nodeBtns"></div><h3 id="nodeTitle"></h3><p id="nodeDesc"></p><label>候选备注<input id="nodeNote" placeholder="输入节点候选信息"></label></section><section class="card"><h2>候选BOM</h2><table><thead><tr><th>构件</th><th>候选规格</th><th>数量/长度</th></tr></thead><tbody id="bom"></tbody></table><p class="note">7榀形成6个纵向开间，平均约9.04m。檩条次支承待深化；理论线长不代表下料长度、重量或采购定额。</p></section><section class="card"><h2>版本管理</h2><div class="row"><button id="save">保存本地REV15.1</button><button id="export">导出JSON</button><button id="import">导入JSON</button><button id="restore">恢复REV15参数</button></div><input type="file" id="file" accept=".json,application/json" hidden><p id="status">REV15只读基线；浏览器本地保存不等于云端同步。</p><table><thead><tr><th>参数</th><th>REV15</th><th>当前</th></tr></thead><tbody id="diff"></tbody></table></section></main><script>
const BASE={span:39,length:178,height:18,slope:10,column:'H250×250×9×14',chord:'RHS150×100×5',web:'RHS75×75×4',purlin:'Z200×70×20×2.5',plate:20,notes:{}};let s=JSON.parse(JSON.stringify(BASE)),selected='N01',yaw=-.6,pitch=.35,zoom=1;const $=id=>document.getElementById(id),fields={span:'跨度 ft',length:'纵长 ft',height:'柱高 ft',slope:'坡度 1:N',column:'H柱截面',chord:'桁架弦杆',web:'腹杆',purlin:'檩条',plate:'底板厚度 mm'},nodes={N01:['柱脚','底板350×350mm、4-M24/柱候选；核对柱脚、短柱及锚固'],N02:['桁架端部','桁架与柱顶连接；端板、螺栓和受力边界待定'],N03:['腹杆节点','弦杆、腹杆、节点板及焊缝候选'],N04:['檩条节点','檩条与桁架上弦连接；次支承待确定'],N05:['X支撑','首尾开间纵向支撑及节点板候选'],N06:['偏心转换','F1共21点，14柱候选；A3报告居中，实际偏心量未填写']};function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function valid(o){for(const [k,a,b] of [['span',10,100],['length',40,400],['height',8,50],['slope',2,30],['plate',5,80]])if(!Number.isFinite(+o[k])||+o[k]<a||+o[k]>b)throw Error(k+'超出范围');for(const k of ['column','chord','web','purlin'])if(typeof o[k]!=='string'||o[k].length>100)throw Error(k+'格式错误');return {...BASE,...o,notes:Object.fromEntries(Object.entries(o.notes||{}).filter(([k,v])=>nodes[k]&&typeof v==='string').map(([k,v])=>[k,v.slice(0,500)]))}}function fieldsUI(){ $('fields').innerHTML=Object.entries(fields).map(([k,v])=>'<label>'+v+'<input data-k="'+k+'" type="'+(['span','length','height','slope','plate'].includes(k)?'number':'text')+'" value="'+esc(s[k])+'"></label>').join('');$('fields').querySelectorAll('input').forEach(el=>el.onchange=()=>{try{s=valid({...s,[el.dataset.k]:el.type==='number'?+el.value:el.value});render()}catch(e){alert(e.message);fieldsUI()}})}function nodeUI(){$('nodeBtns').innerHTML=Object.keys(nodes).map(k=>'<button data-n="'+k+'">'+k+'</button>').join('');$('nodeTitle').textContent=selected+'｜'+nodes[selected][0];$('nodeDesc').textContent=nodes[selected][1];$('nodeNote').value=s.notes[selected]||''}function render(){const m=.3048,S=s.span*m,H=s.height*m,r=S/(2*s.slope),upper=2*Math.hypot(S/2,r);const rows=[['H柱',s.column,'14根 / '+(14*H).toFixed(2)+'m'],['上弦',s.chord,'7榀 / '+(7*upper).toFixed(2)+'m'],['下弦',s.chord,'7榀 / '+(7*S).toFixed(2)+'m'],['腹杆',s.web,'7榀 / 分格待定'],['檩条',s.purlin,'数量待定'],['柱脚底板','350×350×'+s.plate+'mm','14块'],['M24锚栓','候选','56根'],['端部连接','N02候选','14套'],['X支撑','N05候选','首尾开间']];$('bom').innerHTML=rows.map(a=>'<tr>'+a.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('');$('diff').innerHTML=Object.keys(fields).map(k=>'<tr><td>'+esc(fields[k])+'</td><td>'+esc(BASE[k])+'</td><td>'+esc(s[k])+'</td></tr>').join('');draw()}const canvas=$('c'),ctx=canvas.getContext('2d');function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w)return;const dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const S=s.span,L=s.length,H=s.height,R=S/(2*s.slope);const scale=Math.min((w-24)/(Math.abs(L*Math.sin(yaw))+Math.abs(S*Math.cos(yaw))+20),(h-24)/(Math.abs(L*Math.cos(yaw)*Math.sin(pitch))+Math.abs(S*Math.sin(yaw)*Math.sin(pitch))+(H+R)*Math.cos(pitch)+16))*zoom;function p(v){const x=v[0],y=v[1]-H/2,z=v[2],xx=x*Math.cos(yaw)-z*Math.sin(yaw),zz=x*Math.sin(yaw)+z*Math.cos(yaw);return[w/2+xx*scale,h/2-(y*Math.cos(pitch)-zz*Math.sin(pitch))*scale]}function line(a,b,color='#29695e',width=2){let A=p(a),B=p(b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(...A);ctx.lineTo(...B);ctx.stroke()}for(let i=0;i<7;i++){let z=-L/2+i*L/6;if($('columns').checked)for(const x of [-S/2,S/2])line([x,0,z],[x,H,z],'#1d4942',3);if($('trusses').checked){line([-S/2,H,z],[0,H+R,z]);line([0,H+R,z],[S/2,H,z]);line([-S/2,H,z],[S/2,H,z]);for(let j=1;j<6;j++){let x=-S/2+j*S/6;line([x,H,z],[x,H+R*(1-Math.abs(x)/(S/2)),z],'#6e9e91',1)}}}if($('braces').checked)for(let i of [0,5])for(let x of [-S/2,S/2]){let z=-L/2+i*L/6,n=z+L/6;line([x,0,z],[x,H,n],'#b78b54',1.5);line([x,H,z],[x,0,n],'#b78b54',1.5)}}function view(v){if(v==='iso'){yaw=-.6;pitch=.35}else if(v==='front'){yaw=0;pitch=0}else if(v==='side'){yaw=Math.PI/2;pitch=0}else{yaw=0;pitch=1.55}draw()}let pts=new Map(),last=0;canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);last=0};canvas.onpointermove=e=>{if(!pts.has(e.pointerId))return;let old=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);let a=[...pts.values()];if(a.length===1){yaw+=(e.clientX-old[0])*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-old[1])*.006))}else{let d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(last)zoom=Math.max(.3,Math.min(5,zoom*d/last));last=d}draw()};for(const n of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(n,e=>{pts.delete(e.pointerId);last=0});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.3,Math.min(5,zoom*(e.deltaY>0?.9:1.1)));draw()},{passive:false});$('views').onclick=e=>{if(e.target.dataset.v)view(e.target.dataset.v)};$('reset').onclick=()=>{zoom=1;view('iso')};for(const k of ['columns','trusses','braces'])$(k).onchange=draw;$('nodeBtns').onclick=e=>{if(e.target.dataset.n){selected=e.target.dataset.n;nodeUI()}};$('nodeNote').oninput=e=>{s.notes[selected]=e.target.value.slice(0,500)};$('save').onclick=()=>{localStorage.setItem('win-crown-rev15-1',JSON.stringify(s));$('status').textContent='已保存到当前浏览器本地，不是云端'};$('export').onclick=()=>{let b=new Blob([JSON.stringify({...s,version:'REV15.1'},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='WIN_CROWN_REV15_1.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let f=e.target.files[0];if(!f||f.size>100000)throw Error('文件无效或过大');s=valid(JSON.parse(await f.text()));fieldsUI();nodeUI();render();$('status').textContent='JSON已导入，尚未保存'}catch(err){alert(err.message)}};$('restore').onclick=()=>{if(confirm('恢复REV15参数？不删除本地备份')){s=JSON.parse(JSON.stringify(BASE));fieldsUI();nodeUI();render()}};try{let saved=localStorage.getItem('win-crown-rev15-1');if(saved)s=valid(JSON.parse(saved))}catch(e){}fieldsUI();nodeUI();render();new ResizeObserver(draw).observe(canvas);
</script></html>
