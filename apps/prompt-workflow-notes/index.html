<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 指令流程笔记 - Alan-Toolkit</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>📝 AI 指令流程笔记</h1>
      <button id="themeToggle" aria-label="切换主题">🌙</button>
    </div>
  </header>

  <main>
    <!-- Toolbar -->
    <div id="toolbar">
      <div id="search-wrap">
        <input id="searchInput" type="text" placeholder="搜索笔记…" />
      </div>
      <button id="filterToggle" class="toolbar-btn" title="标签筛选">🏷️ 标签</button>
      <button id="addNoteBtn" class="toolbar-btn primary">+ 新建</button>
      <button id="moreMenuBtn" class="toolbar-btn" title="更多">⋯</button>
    </div>

    <!-- More Menu Dropdown -->
    <div id="moreMenu" class="dropdown" style="display:none">
      <button id="exportDataBtn">📤 导出全部数据</button>
      <button id="importDataBtn">📥 导入数据</button>
      <input type="file" id="importFileInput" accept=".json" hidden />
    </div>

    <!-- Active Filters Display -->
    <div id="activeFilters" style="display:none"></div>

    <!-- Category Tabs -->
    <div id="categoryTabs">
      <button class="cat-tab active" data-cat="all">📋 全部</button>
      <button class="cat-tab" data-cat="ai-prompts">🤖 AI 对话</button>
      <button class="cat-tab" data-cat="opencode">⚡ OpenCode</button>
      <button class="cat-tab" data-cat="plan-build">📋 Plan→Build</button>
      <button class="cat-tab" data-cat="git">🐙 Git</button>
      <button class="cat-tab" data-cat="termux">📱 Termux</button>
      <button class="cat-tab" data-cat="aunt-house">🏗️ AuntHouse</button>
      <button class="cat-tab" data-cat="me-solar">🔌 M&E/Solar</button>
      <button class="cat-tab" data-cat="image-gen">🎨 图片生成</button>
    </div>

    <!-- Tag Filter Panel -->
    <div id="tagPanel" class="collapsed">
      <div id="tagList"></div>
      <p id="tagEmpty" class="empty-tags">暂无标签</p>
    </div>

    <!-- Sort Bar -->
    <div id="sortBar">
      <span class="sort-label">排序：</span>
      <select id="sortSelect">
        <option value="updated">最近更新</option>
        <option value="created">创建时间</option>
        <option value="favorite">收藏优先</option>
        <option value="lastUsed">最近使用</option>
      </select>
      <span id="resultCount" class="result-count"></span>
    </div>

    <!-- Notes Grid -->
    <div id="notesGrid"></div>
    <div id="emptyState" class="empty-state" style="display:none">暂无匹配的笔记</div>

    <!-- Pagination -->
    <div id="pagination" style="display:none">
      <button id="pagePrev" disabled>‹ 上一页</button>
      <span id="pageInfo"></span>
      <button id="pageNext" disabled>下一页 ›</button>
    </div>
  </main>

  <!-- Note Modal (Create / Edit) -->
  <div id="noteModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">新建笔记</h3>
        <button id="modalClose" class="modal-close-btn">✕</button>
      </div>
      <form id="noteForm">
        <div class="form-group">
          <label for="fieldTitle">标题 *</label>
          <input id="fieldTitle" name="title" required maxlength="200" placeholder="笔记标题" />
        </div>
        <div class="form-group">
          <label for="fieldCategory">分类</label>
          <select id="fieldCategory" name="category">
            <option value="ai-prompts">🤖 AI 对话提示词</option>
            <option value="opencode">⚡ OpenCode / Codex</option>
            <option value="plan-build">📋 Plan → Build 工作流</option>
            <option value="git">🐙 Git / GitHub</option>
            <option value="termux">📱 Termux</option>
            <option value="aunt-house">🏗️ AuntHouse</option>
            <option value="me-solar">🔌 M&E / Solar</option>
            <option value="image-gen">🎨 图片生成</option>
          </select>
        </div>
        <div class="form-group">
          <label for="fieldTags">标签（逗号分隔）</label>
          <input id="fieldTags" name="tags" placeholder="workflow, dev, template" />
        </div>
        <div class="form-group">
          <label for="fieldSummary">摘要</label>
          <textarea id="fieldSummary" name="summary" rows="2" placeholder="简要描述…"></textarea>
        </div>
        <div class="form-group">
          <label for="fieldPrompt">完整提示词</label>
          <textarea id="fieldPrompt" name="prompt" rows="5" placeholder="粘贴完整提示词…"></textarea>
        </div>
        <div class="form-group">
          <label for="fieldSteps">操作步骤（每行一步）</label>
          <textarea id="fieldSteps" name="steps" rows="4" placeholder="1. 步骤一&#10;2. 步骤二"></textarea>
        </div>
        <div class="form-group">
          <label for="fieldNotes">注意事项</label>
          <textarea id="fieldNotes" name="notes" rows="2" placeholder="注意事项…"></textarea>
        </div>
        <div id="formError" class="form-error" style="display:none"></div>
        <div class="modal-actions">
          <button type="submit" class="btn-primary" id="saveNoteBtn">保存</button>
          <button type="button" class="btn-secondary" id="cancelNoteBtn">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Detail Panel -->
  <div id="detailOverlay" class="detail-overlay" style="display:none">
    <div class="detail-panel">
      <div class="detail-header">
        <div class="detail-header-left">
          <span id="detailCategory" class="detail-cat-badge"></span>
          <h2 id="detailTitle"></h2>
        </div>
        <button id="detailClose" class="modal-close-btn">✕</button>
      </div>
      <div class="detail-body" id="detailBody"></div>
      <div class="detail-footer">
        <button id="detailCopy" class="detail-btn copy">📋 复制提示词</button>
        <button id="detailFavorite" class="detail-btn fav">⭐ 收藏</button>
        <button id="detailEdit" class="detail-btn edit">✏️ 编辑</button>
        <button id="detailDelete" class="detail-btn delete">🗑️ 删除</button>
      </div>
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div id="confirmOverlay" class="modal-overlay" style="display:none">
    <div class="modal confirm-modal">
      <p id="confirmMessage"></p>
      <div class="modal-actions">
        <button id="confirmYes" class="btn-primary">确认</button>
        <button id="confirmNo" class="btn-secondary">取消</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" style="display:none"></div>

  <script src="script.js"></script>
</body>
</html>
