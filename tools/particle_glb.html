<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D 粒子 · GLB 模型 - Alan Toolkit</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* particle_glb 页面专用：全屏 3D + 玻璃拟态控制面板 */
    html, body { margin: 0; height: 100%; background: #05050a; color: #e8eaf2; overflow: hidden; }
    #wrap { position: relative; width: 100vw; height: 100vh; }
    #glcanvas { display: block; width: 100%; height: 100%; }
    #loading {
      position: absolute; inset: 0; z-index: 30; display: grid; place-items: center;
      background: #05050a; color: #e8eaf2; font-size: 14px; letter-spacing: 0.5px;
      transition: opacity .4s;
    }
    .panel {
      position: absolute; top: 14px; left: 14px; z-index: 40;
      width: min(300px, 92vw); padding: 14px 16px 16px;
      background: rgba(15, 15, 24, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; backdrop-filter: blur(14px) saturate(140%);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      color: #e8eaf2; font-size: 13px; line-height: 1.5;
    }
    .panel h1 { margin: 0 0 6px; font-size: 17px; font-weight: 800; letter-spacing: -0.4px;
      background: linear-gradient(90deg, #8b5cf6, #f59e0b); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text; }
    .panel p.sub { margin: 0 0 12px; color: #94a3b8; font-size: 12px; }
    .group { margin-bottom: 11px; }
    .group:last-child { margin-bottom: 0; }
    .g-title { display:flex; align-items:center; gap:8px; margin-bottom: 7px; font-size: 12.5px; font-weight: 700; color: #cbd5e1; }
    .g-title i { color: #8b5cf6; }
    .row { display:flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; font-size: 12px; color: #94a3b8; }
    input[type=range] { width: 100%; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.08);
      outline: none; -webkit-appearance: none; accent-color: #8b5cf6; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: #8b5cf6; cursor: pointer; box-shadow: 0 0 10px rgba(139,92,246,0.7); }
    input[type=color] { width: 36px; height: 28px; border: none; border-radius: 8px; cursor: pointer; background: transparent; }
    .btn {
      width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05); color: #e8eaf2; font-size: 12.5px; font-weight: 600;
      cursor: pointer; transition: .2s; margin-top: 2px;
    }
    .btn:hover { border-color: #8b5cf6; background: rgba(139,92,246,0.15); }
    .btn:active { transform: scale(.98); }
    .status {
      margin-top: 10px; padding: 8px 10px; border-radius: 10px;
      background: rgba(139,92,246,0.12); border: 1px solid rgba(139,92,246,0.35);
      color: #c7d2fe; font-size: 11.5px; text-align: center;
    }
    .hint {
      position: absolute; bottom: 12px; right: 12px; z-index: 40;
      padding: 10px 12px; border-radius: 10px;
      background: rgba(15,15,24,0.72); border: 1px solid rgba(255,255,255,0.08);
      color: #94a3b8; font-size: 11.5px; max-width: 210px; line-height: 1.5;
    }
    .hint b { color: #e8eaf2; }
    @media (max-width: 600px) { .panel { width: 90vw; font-size: 12px; } }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="glcanvas"></canvas>

    <div id="loading">初始化 3D 场景…</div>

    <div class="panel">
      <h1>3D 粒子·GLB</h1>
      <p class="sub">纯点云渲染 &bull; 加法混合 &bull; 双指缩放 &bull; 滑块实时控制</p>

      <div class="group">
        <div class="g-title"><i class="fas fa-palette"></i> 粒子颜色</div>
        <div class="row"><span>颜色</span><span id="vColor">#8b5cf6</span></div>
        <input type="color" id="pColor" value="#8b5cf6">
      </div>

      <div class="group">
        <div class="g-title"><i class="fas fa-expand"></i> 粒子大小</div>
        <div class="row"><span>大小</span><span id="vSize">0.35</span></div>
        <input type="range" id="pSize" min="0.1" max="2" step="0.05" value="0.35">
      </div>

      <div class="group">
        <div class="g-title"><i class="fas fa-layer-group"></i> 粒子数量</div>
        <div class="row"><span>数量</span><span id="vCount">2000</span></div>
        <input type="range" id="pCount" min="100" max="10000" step="100" value="2000">
      </div>

      <div class="group">
        <div class="g-title"><i class="fas fa-opacity"></i> 透明度</div>
        <div class="row"><span>不透明</span><span id="vOpacity">0.8</span></div>
        <input type="range" id="pOpacity" min="0" max="1" step="0.05" value="0.8">
      </div>

      <div class="group">
        <div class="g-title"><i class="fas fa-cube"></i> GLB 模型</div>
        <button class="btn" id="btnLoadGLB">加载本地 GLB / GLTF</button>
        <input type="file" id="glbFileHidden" accept=".glb,.gltf" style="display:none;">
        <div class="status" id="status">内置占位点云（无网络依赖）</div>
      </div>
    </div>

    <div class="hint">
      <b>手势：</b>单指/左键拖拽旋转 &bull; 双指捏合缩放粒子群 &bull; 滚轮缩放相机 &bull; 双击重置
    </div>
  </div>

  <input type="file" id="glbFileHidden2" accept=".glb,.gltf" style="display:none;">

  <!-- Three.js ES modules via importmap（纯静态，无构建） -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    /* ---------- 配置 ---------- */
    const CFG = {
      count: 2000,
      size: 0.35,
      color: 0x8b5cf6,
      opacity: 0.8,   // 默认不为 0，确保粒子可见
      speed: 0.0005,
      radius: 18,
    };

    /* ---------- 工具 ---------- */
    const $ = id => document.getElementById(id);

    function makeParticleMap(size = 128) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d', { willReadFrequently: false });
      const r = size / 2;
      const g = ctx.createRadialGradient(r, r, 0, r, r, r);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.30, 'rgba(139, 92, 246, 0.85)');
      g.addColorStop(0.70, 'rgba(99, 102, 241, 0.35)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      const t = new THREE.CanvasTexture(c);
      t.needsUpdate = true;
      return t;
    }

    function showStatus(msg, ok = true) {
      const el = $('status');
      el.textContent = msg;
      el.style.color = ok ? '#a5f3fc' : '#fca5a5';
      el.style.background = ok ? 'rgba(139,92,246,0.12)' : 'rgba(255,165,165,0.12)';
      el.style.borderColor = ok ? 'rgba(139,92,246,0.35)' : 'rgba(255,165,165,0.35)';
    }

    /* ---------- 全局状态 ---------- */
    let scene, camera, renderer, rafId;
    let particles = null, pMaterial = null, pGeometry = null;

    // 原始顶点（Float32Array，xyz...）与对应颜色
    let basePositions = null;
    let baseColors = null;
    let totalVertices = 0;

    // 当前显示数量（通过 drawRange 控制，无需重建几何体）
    let currentCount = CFG.count;

    // 粒子群本体缩放（膨胀/聚拢），由双指捏合驱动
    let particleScale = 1.0;
    let targetParticleScale = 1.0;

    // 轨道相机
    const controls = { theta: 0, phi: Math.PI * 0.35, dist: 40, target: new THREE.Vector3() };

    // 多指追踪
    const pointers = new Map(); // pointerId -> {x,y}
    let touchDist = 0;

    /* ---------- 初始化 ---------- */
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05050a);
      scene.fog = new THREE.Fog(0x05050a, 15, 90);

      camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
      camera.position.set(0, 0, CFG.dist || 40);

      const canvas = $('glcanvas');
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);

      // 灯光（对点云无实质影响，保留用于氛围）
      scene.add(new THREE.AmbientLight(0xffffff, 0.4));
      const dl = new THREE.DirectionalLight(0x8b5cf6, 1.0);
      dl.position.set(5, 8, 5); scene.add(dl);

      // 材质：圆柔和贴图 + 加法混合 + 顶点颜色
      const pMap = makeParticleMap();
      pMaterial = new THREE.PointsMaterial({
        map: pMap,
        color: new THREE.Color(CFG.color),
        size: CFG.size,
        transparent: true,
        opacity: CFG.opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: true,
        sizeAttenuation: true,
        vertexColors: true,
      });

      // 内置占位点云（球体分布），确保开箱即用可见
      buildPlaceholderPoints();

      window.addEventListener('resize', onResize);
      setupGestures(canvas);
      setupUI();

      $('loading').style.opacity = '0';
      setTimeout(() => $('loading').remove(), 400);

      animate();
    }

    /* 构建内置占位点云（球壳均匀分布） */
    function buildPlaceholderPoints() {
      const n = CFG.count;
      const positions = new Float32Array(n * 3);
      const colors = new Float32Array(n * 3);
      const color = new THREE.Color(CFG.color);

      for (let i = 0; i < n; i++) {
        const u = Math.random(), v = Math.random();
        const theta = 2 * Math.PI * u;
        const phi = Math.acos(2 * v - 1);
        const rad = CFG.radius * (0.5 + Math.random());
        positions[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = rad * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = rad * Math.cos(phi);

        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }

      basePositions = positions;
      baseColors = colors;
      totalVertices = n;
      currentCount = Math.min(CFG.count, n);
      $('pCount').max = Math.max(10000, n);
      $('pCount').value = currentCount;
      $('vCount').textContent = currentCount;

      createPoints();
      showStatus('内置占位点云：' + n + ' 个顶点');
    }

    /* 根据当前 basePositions/baseColors 创建 Points 对象 */
    function createPoints() {
      if (particles) {
        scene.remove(particles);
        if (pGeometry) pGeometry.dispose();
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(basePositions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(baseColors, 3));
      geo.setDrawRange(0, Math.min(currentCount, totalVertices));

      particles = new THREE.Points(geo, pMaterial);
      scene.add(particles);
      pGeometry = geo;
    }

    /* 居中缩放顶点数组（in-place，Float32Array xyz...） */
    function centerAndScaleArray(arr) {
      let minX = Infinity, minY = Infinity, minZ = Infinity;
      let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
      for (let i = 0; i < arr.length; i += 3) {
        const x = arr[i], y = arr[i + 1], z = arr[i + 2];
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
        if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
      }
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const cz = (minZ + maxZ) / 2;
      let maxDim = 0;
      for (let i = 0; i < arr.length; i += 3) {
        const dx = Math.abs(arr[i] - cx);
        const dy = Math.abs(arr[i + 1] - cy);
        const dz = Math.abs(arr[i + 2] - cz);
        if (dx > maxDim) maxDim = dx;
        if (dy > maxDim) maxDim = dy;
        if (dz > maxDim) maxDim = dz;
      }
      const scale = CFG.radius / (maxDim || 1);
      for (let i = 0; i < arr.length; i += 3) {
        arr[i] = (arr[i] - cx) * scale;
        arr[i + 1] = (arr[i + 1] - cy) * scale;
        arr[i + 2] = (arr[i + 2] - cz) * scale;
      }
    }

    /* ---------- GLB 强制粒子化：不渲染 Mesh，仅提取顶点 ---------- */
    function loadGLB(url) {
      const loader = new GLTFLoader();
      loader.load(
        url,
        (gltf) => {
          const raw = [];
          gltf.scene.traverse((child) => {
            if (child.isMesh && child.geometry && child.geometry.attributes.position) {
              const posAttr = child.geometry.attributes.position;
              child.updateMatrixWorld();
              const m = child.matrixWorld;
              for (let i = 0; i < posAttr.count; i++) {
                const x = posAttr.getX(i);
                const y = posAttr.getY(i);
                const z = posAttr.getZ(i);
                const v = new THREE.Vector3(x, y, z).applyMatrix4(m);
                raw.push(v.x, v.y, v.z);
              }
            }
          });

          if (raw.length === 0) {
            showStatus('未从模型中提取到有效顶点', false);
            return;
          }

          centerAndScaleArray(raw);

          const colors = new Float32Array(raw.length);
          const color = new THREE.Color(CFG.color);
          for (let i = 0; i < colors.length / 3; i++) {
            colors[i * 3] = color.r;
            colors[i * 3 + 1] = color.g;
            colors[i * 3 + 2] = color.b;
          }

          basePositions = new Float32Array(raw);
          baseColors = colors;
          totalVertices = raw.length / 3;
          currentCount = Math.min(CFG.count, totalVertices);
          $('pCount').max = Math.max(10000, totalVertices);
          $('pCount').value = currentCount;
          $('vCount').textContent = currentCount;

          createPoints();
          showStatus('GLB 粒子化完成：' + totalVertices + ' 个顶点（已禁用 Mesh 渲染）');
        },
        undefined,
        (err) => {
          console.warn('GLB 加载失败:', err);
          showStatus('GLB 加载失败，保留占位点云', false);
        }
      );
    }

    /* ---------- 手势：单指旋转 / 双指捏合缩放粒子群 / 滚轮相机 ---------- */
    function setupGestures(el) {
      const onDown = (e) => {
        e.preventDefault();
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        el.setPointerCapture(e.pointerId);
      };

      const onMove = (e) => {
        e.preventDefault();
        const prev = pointers.get(e.pointerId);
        if (!prev) return;
        const dx = e.clientX - prev.x;
        const dy = e.clientY - prev.y;
        pointers.get(e.pointerId).x = e.clientX;
        pointers.get(e.pointerId).y = e.clientY;

        if (pointers.size === 1) {
          // 单指 / 左键：绕目标旋转（轨道）
          controls.theta += dx * 0.004;
          controls.phi = THREE.MathUtils.clamp(controls.phi + dy * 0.004, 0.05, Math.PI - 0.05);
        } else if (pointers.size >= 2) {
          // 双指：捏合控制粒子群本体缩放（膨胀/聚拢）
          const vals = [...pointers.values()];
          const d = Math.hypot(vals[0].x - vals[1].x, vals[0].y - vals[1].y);
          if (touchDist) {
            const delta = (d - touchDist) * 0.004;
            targetParticleScale = THREE.MathUtils.clamp(targetParticleScale + delta, 0.1, 4.0);
          }
          touchDist = d;
        }
      };

      const onUp = (e) => {
        pointers.delete(e.pointerId);
        if (pointers.size === 0) touchDist = 0;
        el.releasePointerCapture(e.pointerId);
      };

      el.addEventListener('pointerdown', onDown, { passive: false });
      el.addEventListener('pointermove', onMove, { passive: false });
      el.addEventListener('pointerup', onUp, { passive: false });
      el.addEventListener('pointercancel', onUp, { passive: false });

      // 双击（两次快速单指抬起）：重置视角与粒子缩放
      let lastTap = 0;
      el.addEventListener('pointerup', (e) => {
        if (pointers.size === 0) {
          const now = Date.now();
          if (now - lastTap < 300) {
            controls.dist = 40;
            controls.theta = 0;
            controls.phi = Math.PI * 0.35;
            targetParticleScale = 1.0;
          }
          lastTap = now;
        }
      }, { passive: false });

      // 滚轮：相机远近（与粒子群本体缩放分离）
      el.addEventListener('wheel', (e) => {
        e.preventDefault();
        controls.dist = THREE.MathUtils.clamp(controls.dist + e.deltaY * 0.03, 10, 120);
      }, { passive: false });
    }

    function onResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }

    function updateCamera() {
      const phi = THREE.MathUtils.clamp(controls.phi, 0.05, Math.PI - 0.05);
      camera.position.x = controls.dist * Math.sin(phi) * Math.sin(controls.theta);
      camera.position.y = controls.dist * Math.cos(phi);
      camera.position.z = controls.dist * Math.sin(phi) * Math.cos(controls.theta);
      camera.lookAt(controls.target);
    }

    /* ---------- UI 实时绑定 ---------- */
    function setupUI() {
      // 粒子颜色：同时更新 material.color 与所有顶点颜色
      $('pColor').addEventListener('input', (e) => {
        const hex = e.target.value;
        const c = new THREE.Color(hex);
        pMaterial.color.set(c);
        $('vColor').textContent = hex;
        if (baseColors) {
          for (let i = 0; i < baseColors.length / 3; i++) {
            baseColors[i * 3] = c.r;
            baseColors[i * 3 + 1] = c.g;
            baseColors[i * 3 + 2] = c.b;
          }
          if (pGeometry) pGeometry.attributes.color.needsUpdate = true;
        }
      });

      // 粒子大小
      $('pSize').addEventListener('input', (e) => {
        pMaterial.size = parseFloat(e.target.value);
        $('vSize').textContent = e.target.value;
      });

      // 粒子数量：通过 drawRange 控制，无需重建几何体
      $('pCount').addEventListener('input', (e) => {
        currentCount = parseInt(e.target.value);
        $('vCount').textContent = currentCount;
        if (pGeometry) {
          pGeometry.setDrawRange(0, Math.min(currentCount, totalVertices));
        }
      });

      // 透明度（默认 0.8，确保可见）
      $('pOpacity').addEventListener('input', (e) => {
        pMaterial.opacity = parseFloat(e.target.value);
        $('vOpacity').textContent = e.target.value;
      });

      // 加载本地 GLB
      $('btnLoadGLB').addEventListener('click', () => $('glbFileHidden').click());
      $('glbFileHidden').addEventListener('change', (e) => {
        if (e.target.files[0]) loadGLB(URL.createObjectURL(e.target.files[0]));
      });
    }

    /* ---------- 动画循环 ---------- */
    function animate() {
      rafId = requestAnimationFrame(animate);

      // 相机
      updateCamera();

      // 粒子群本体平滑缩放（膨胀/聚拢）
      particleScale += (targetParticleScale - particleScale) * 0.06;

      if (pGeometry && basePositions) {
        const posAttr = pGeometry.attributes.position;
        const array = posAttr.array;
        const drawCount = Math.min(currentCount, totalVertices);
        for (let i = 0; i < drawCount * 3; i += 3) {
          array[i] = basePositions[i] * particleScale;
          array[i + 1] = basePositions[i + 1] * particleScale;
          array[i + 2] = basePositions[i + 2] * particleScale;
        }
        posAttr.needsUpdate = true;
      }

      // 缓慢自转
      if (particles) {
        particles.rotation.y += CFG.speed;
        particles.rotation.x += CFG.speed * 0.5;
      }

      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
